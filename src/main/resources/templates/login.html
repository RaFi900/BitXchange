<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>BitXchange - Login</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<!--Header with Thymeleaf image -->
<header class="simple-header">
    <div class="logo-brand">
        <img th:src="@{/images/Capture.png}" />
        <h1 class="brand">BitXchange</h1>
    </div>
</header>

<!-- Login Form -->
<div class="auth-container">
    <h2>Welcome Back to BitXchange</h2>

    <!-- POST to /login using a backend-bound object "loginRequest" -->
    <form th:action="@{/login}" th:object="${userLogin}" method="post">

        <input type="email" th:field="*{email}" placeholder="Email" required />
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>


        <div class="password-field">
            <input type="password" th:field="*{password}" placeholder="Password" id="login-password" required />
            <span class="toggle-password" onclick="togglePassword('login-password', this)">👁️</span>
        </div>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <!-- Backend login error -->
        <div class="error" th:if="${loginError}" th:text="${loginError}"></div>


        <button type="submit" class="btn">Log In</button>
    </form>

    <p>Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
</div>

<!-- Password toggle JS -->
<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "🙈";
        } else {
            input.type = "password";
            icon.textContent = "👁️";
        }
    }
</script>
</body>
</html>
